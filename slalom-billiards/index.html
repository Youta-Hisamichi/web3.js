<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>スラロームビリヤード</title>
<style>
  :root{--bg:#10151c;--panel:#1b2430;--fg:#e9eef5;--mut:#8fa0b5;--acc:#ffd24a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#0b3d2a;max-width:100vw;max-height:100vh;touch-action:none;display:block}
  .overlay{position:fixed;inset:0;background:rgba(8,12,18,.88);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
  .overlay.hidden{display:none}
  .card{background:var(--panel);border-radius:16px;padding:24px;max-width:640px;width:100%;box-shadow:0 10px 40px #0008}
  h1{margin:0 0 4px;font-size:26px}
  p.sub{margin:0 0 16px;color:var(--mut);font-size:14px;line-height:1.5}
  .row{display:grid;grid-template-columns:14px 1fr 150px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #ffffff14}
  .dot{width:14px;height:14px;border-radius:50%}
  .keys{font-size:12px;color:var(--mut)}
  select{background:#0f1620;color:var(--fg);border:1px solid #ffffff30;border-radius:8px;padding:8px;font-size:14px;width:100%}
  .opt{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;gap:12px}
  .opt select{width:150px}
  button{background:var(--acc);color:#222;border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px}
  button.sec{background:#ffffff1c;color:var(--fg);margin-left:8px}
  .err{color:#ff8a8a;font-size:13px;min-height:18px;margin-top:6px}
  ol{padding-left:22px;margin:10px 0}
  li{margin:6px 0;font-size:18px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="720"></canvas></div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>🎱 スラロームビリヤード</h1>
    <p class="sub">ターンなし！止まらずに撃ちまくれ。ゲートを順番に通過してレースに勝とう。ほかのボールにぶつけて邪魔もOK。ポケットに落ちると直前のゲートからやり直し。</p>
    <div id="slots"></div>
    <div class="opt"><span>周回数</span>
      <select id="laps"><option value="1">1周</option><option value="2" selected>2周</option><option value="3">3周</option></select></div>
    <div class="err" id="err"></div>
    <button id="start">スタート</button>
    <p class="sub" style="margin-top:14px">操作：キーを長押しでパワーを溜めて、離すと発射。動いている最中でも撃てます（クールダウンあり）。<br>1人目の人間はマウス／タッチも可：ポインタの方向へ狙い、押し続けて離すと発射。</p>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="card">
    <h1 id="rtitle"></h1>
    <ol id="rlist"></ol>
    <button id="again">もう一度</button><button id="tomenu" class="sec">メニューへ</button>
  </div>
</div>

<script>
"use strict";
const W = 1280, H = 720, CUSH = 36, R = 14, POST_R = 9, POCKET_R = 28;
const COLORS = ["#ff4d4d", "#4da6ff", "#ffd24a", "#6bff7a"];
const NAMES = ["赤", "青", "黄", "緑"];
const KEYS = [
  { l: "KeyA", r: "KeyD", s: "KeyS", label: "A / D で回転、S で発射" },
  { l: "ArrowLeft", r: "ArrowRight", s: "ArrowDown", label: "← / → で回転、↓ で発射" },
  { l: "KeyJ", r: "KeyL", s: "KeyK", label: "J / L で回転、K で発射" },
  { l: "KeyV", r: "KeyN", s: "KeyB", label: "V / N で回転、B で発射" },
];
const AI = { easy: { err: .2, gap: 1.1 }, normal: { err: .09, gap: .65 }, hard: { err: .025, gap: .4 } };

// ---- course: gates defined by center, forward angle (deg), width ----
const GATE_DEF = [
  [160, 330, -90, 120], [330, 220, 0, 100], [520, 400, 0, 100], [710, 220, 0, 100],
  [900, 400, 0, 100], [1120, 520, 90, 120], [640, 620, 180, 100], [160, 520, -90, 120],
];
const gates = GATE_DEF.map(([cx, cy, deg, w]) => {
  const a = deg * Math.PI / 180, nx = Math.cos(a), ny = Math.sin(a), tx = -ny, ty = nx;
  return { cx, cy, nx, ny, A: { x: cx + tx * w / 2, y: cy + ty * w / 2 }, B: { x: cx - tx * w / 2, y: cy - ty * w / 2 } };
});
const posts = gates.flatMap(g => [g.A, g.B]);
const pockets = [[CUSH, CUSH], [W - CUSH, CUSH], [CUSH, H - CUSH], [W - CUSH, H - CUSH]];
const START = [[90, 410], [130, 450], [170, 410], [210, 450]];

// ---- audio ----
let actx = null;
function beep(freq, dur, vol, type) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(Math.min(vol, .3), actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
}

// ---- state ----
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let players = [], game = null, lastT = 0, mouse = { x: W / 2, y: H / 2, down: false, active: false };
const held = new Set();

function mkPlayer(slot, type, level, laps) {
  const s = START[slot];
  return { slot, type, level, color: COLORS[slot], name: NAMES[slot], x: s[0], y: s[1], px: s[0], py: s[1], vx: 0, vy: 0,
    aim: -Math.PI / 2, charging: false, ct: 0, cd: 0, prog: 0, total: gates.length * laps, falling: 0, scale: 1,
    finished: false, aiNext: 0, trail: [], flash: 0, mouseCtl: false };
}

function startGame() {
  const cfg = [];
  document.querySelectorAll("#slots select").forEach((sel, i) => { if (sel.value !== "off") cfg.push([i, sel.value]); });
  const err = document.getElementById("err");
  if (cfg.length < 2) { err.textContent = "2人以上を選んでください"; return; }
  err.textContent = "";
  const laps = +document.getElementById("laps").value;
  players = cfg.map(([i, v]) => v === "human" ? mkPlayer(i, "human", null, laps) : mkPlayer(i, "cpu", v.split(":")[1], laps));
  const firstHuman = players.find(p => p.type === "human");
  if (firstHuman) firstHuman.mouseCtl = true;
  game = { state: "count", t: 3.99, time: 0, laps, winner: null, paused: false };
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  if (!actx) try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
window.__startGame = startGame;

function buildMenu() {
  const box = document.getElementById("slots");
  for (let i = 0; i < 4; i++) {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = `<span class="dot" style="background:${COLORS[i]}"></span>
      <div><b>${NAMES[i]}</b><div class="keys">${KEYS[i].label}${i === 0 ? "（マウス可）" : ""}</div></div>
      <select><option value="off">なし</option><option value="human">人間</option>
      <option value="cpu:easy">CPU（弱い）</option><option value="cpu:normal">CPU（普通）</option><option value="cpu:hard">CPU（強い）</option></select>`;
    row.querySelector("select").value = i === 0 ? "human" : i === 1 ? "cpu:normal" : "off";
    box.appendChild(row);
  }
}

// ---- input ----
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function mouseOwner() { return players.find(p => p.mouseCtl && !p.finished); }
cv.addEventListener("pointermove", e => { Object.assign(mouse, toCanvas(e)); mouse.active = true; });
cv.addEventListener("pointerdown", e => {
  Object.assign(mouse, toCanvas(e)); mouse.active = true; mouse.down = true;
  if (actx && actx.state === "suspended") actx.resume();
  const p = mouseOwner(); if (p && game && game.state === "race") beginCharge(p);
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointerup", () => {
  mouse.down = false; const p = mouseOwner(); if (p && p.charging) fire(p);
});
addEventListener("keydown", e => {
  if (e.code === "Escape" || e.code === "KeyP") { if (game && game.state === "race") game.paused = !game.paused; return; }
  if (!game) return;
  if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
  if (held.has(e.code)) return;
  held.add(e.code);
  mouse.active = false;
  players.forEach(p => { if (p.type === "human" && e.code === KEYS[p.slot].s && game.state === "race") beginCharge(p); });
});
addEventListener("keyup", e => {
  held.delete(e.code);
  players.forEach(p => { if (p.type === "human" && e.code === KEYS[p.slot].s && p.charging) fire(p); });
});

function beginCharge(p) { if (p.cd <= 0 && !p.falling && !p.finished && !p.charging) { p.charging = true; p.ct = 0; } }
function chargePower(p) { const t = (p.ct * 1.4) % 2; return t < 1 ? t : 2 - t; }
function fire(p, power) {
  const pw = Math.max(.12, power !== undefined ? power : chargePower(p));
  p.charging = false;
  if (p.cd > 0 || p.falling || p.finished) return;
  p.vx += Math.cos(p.aim) * 1000 * pw; p.vy += Math.sin(p.aim) * 1000 * pw;
  p.cd = .45; p.flash = .2;
  beep(220 + 300 * pw, .08, .12, "triangle");
}

// ---- physics ----
function segCross(ax, ay, bx, by, cx, cy, dx, dy) {
  const d1 = (bx - ax) * (cy - ay) - (by - ay) * (cx - ax), d2 = (bx - ax) * (dy - ay) - (by - ay) * (dx - ax);
  const d3 = (dx - cx) * (ay - cy) - (dy - cy) * (ax - cx), d4 = (dx - cx) * (by - cy) - (dy - cy) * (bx - cx);
  return d1 * d2 < 0 && d3 * d4 < 0;
}
function respawn(p) {
  const gi = (p.prog - 1 + gates.length) % gates.length;
  if (p.prog === 0) { const s = START[p.slot]; p.x = s[0]; p.y = s[1]; }
  else { const g = gates[gi]; p.x = g.cx + g.nx * 40; p.y = g.cy + g.ny * 40; }
  p.vx = p.vy = 0; p.falling = 0; p.scale = 1; p.trail.length = 0;
}
function step(dt) {
  const act = players.filter(p => !p.finished);
  for (const p of act) {
    if (p.falling > 0) {
      p.falling -= dt; p.scale = Math.max(0, p.falling > 1 ? (p.falling - 1) / .2 : 0);
      if (p.falling <= 0) respawn(p);
      continue;
    }
    const f = Math.exp(-1.4 * dt); p.vx *= f; p.vy *= f;
    const sp = Math.hypot(p.vx, p.vy);
    if (sp < 4) p.vx = p.vy = 0; else if (sp > 1500) { p.vx *= 1500 / sp; p.vy *= 1500 / sp; }
    p.px = p.x; p.py = p.y; p.x += p.vx * dt; p.y += p.vy * dt;
    // gate crossing
    const g = gates[p.prog % gates.length];
    if (segCross(p.px, p.py, p.x, p.y, g.A.x, g.A.y, g.B.x, g.B.y) && (p.x - p.px) * g.nx + (p.y - p.py) * g.ny > 0) {
      p.prog++; beep(660 + (p.prog % gates.length) * 60, .12, .1, "square");
      if (p.prog >= p.total) { p.finished = true; if (!game.winner) game.winner = p; }
    }
    // walls
    const lo = CUSH + R, hx = W - CUSH - R, hy = H - CUSH - R;
    if (p.x < lo) { p.x = lo; p.vx = Math.abs(p.vx) * .85; wallSnd(p); }
    if (p.x > hx) { p.x = hx; p.vx = -Math.abs(p.vx) * .85; wallSnd(p); }
    if (p.y < lo) { p.y = lo; p.vy = Math.abs(p.vy) * .85; wallSnd(p); }
    if (p.y > hy) { p.y = hy; p.vy = -Math.abs(p.vy) * .85; wallSnd(p); }
    // posts
    for (const q of posts) {
      let dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy), m = R + POST_R;
      if (d < m && d > 0) {
        dx /= d; dy /= d; p.x = q.x + dx * m; p.y = q.y + dy * m;
        const vn = p.vx * dx + p.vy * dy;
        if (vn < 0) { p.vx -= 1.8 * vn * dx; p.vy -= 1.8 * vn * dy; if (-vn > 60) beep(900, .05, Math.min(.15, -vn / 3000), "square"); }
      }
    }
    // pockets
    for (const [qx, qy] of pockets) if (Math.hypot(p.x - qx, p.y - qy) < POCKET_R) {
      p.falling = 1.2; p.vx = p.vy = 0; p.x = qx; p.y = qy; p.charging = false; beep(120, .3, .15, "sine"); break;
    }
  }
  // ball vs ball
  for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
    const a = act[i], b = act[j]; if (a.falling > 0 || b.falling > 0) continue;
    let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d < 2 * R && d > 0) {
      dx /= d; dy /= d; const o = (2 * R - d) / 2;
      a.x -= dx * o; a.y -= dy * o; b.x += dx * o; b.y += dy * o;
      const rv = (b.vx - a.vx) * dx + (b.vy - a.vy) * dy;
      if (rv < 0) {
        const imp = -(1 + .95) * rv / 2;
        a.vx -= imp * dx; a.vy -= imp * dy; b.vx += imp * dx; b.vy += imp * dy;
        if (-rv > 40) beep(400 + Math.random() * 100, .06, Math.min(.25, -rv / 2000), "sine");
      }
    }
  }
}
function wallSnd(p) { const s = Math.hypot(p.vx, p.vy); if (s > 80) beep(150, .05, Math.min(.12, s / 5000), "sine"); }

// ---- AI ----
function aiThink(p, dt) {
  const lv = AI[p.level], g = gates[p.prog % gates.length];
  const side = (p.x - g.cx) * g.nx + (p.y - g.cy) * g.ny;
  let tx = g.cx, ty = g.cy;
  if (side > -20) { tx = g.cx - g.nx * 150; ty = g.cy - g.ny * 150; }
  // dodge posts blocking the straight line
  const dx = tx - p.x, dy = ty - p.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  let best = null, bd = 1e9;
  for (const q of posts) {
    const rx = q.x - p.x, ry = q.y - p.y, along = rx * ux + ry * uy;
    if (along < 10 || along > len) continue;
    const perp = rx * -uy + ry * ux;
    if (Math.abs(perp) < 30 && along < bd) { bd = along; best = { q, perp }; }
  }
  if (best) { const s = best.perp >= 0 ? -1 : 1; tx = best.q.x + (-uy) * s * 55; ty = best.q.y + ux * s * 55; }
  const ex = tx - p.x, ey = ty - p.y, dist = Math.hypot(ex, ey), dir = Math.atan2(ey, ex);
  p.aim = dir;
  p.aiNext -= dt;
  if (p.cd > 0 || p.aiNext > 0 || p.falling > 0) return;
  const sp = Math.hypot(p.vx, p.vy), along = p.vx * Math.cos(dir) + p.vy * Math.sin(dir);
  const need = Math.min(1100, Math.max(350, dist * 1.6));
  if (along > need * .6 && (sp < 1 || along / sp > .7)) return;
  p.aim = dir + (Math.random() - .5) * 2 * lv.err;
  fire(p, Math.min(1, Math.max(.25, (need - Math.max(0, along)) / 1000)));
  p.aiNext = lv.gap * (.7 + Math.random() * .6);
}

// ---- update ----
function update(dt) {
  if (!game || game.paused) return;
  if (game.state === "count") {
    game.t -= dt; if (game.t <= 0) { game.state = "race"; beep(880, .4, .15, "square"); }
    return;
  }
  if (game.state !== "race") return;
  game.time += dt;
  for (const p of players) {
    p.cd = Math.max(0, p.cd - dt); p.flash = Math.max(0, p.flash - dt);
    if (p.finished) continue;
    if (p.type === "human") {
      const k = KEYS[p.slot];
      if (held.has(k.l)) p.aim -= 2.6 * dt;
      if (held.has(k.r)) p.aim += 2.6 * dt;
      if (p.mouseCtl && mouse.active) p.aim = Math.atan2(mouse.y - p.y, mouse.x - p.x);
      if (p.charging) p.ct += dt;
    } else aiThink(p, dt);
  }
  const sub = 4, h = dt / sub;
  for (let i = 0; i < sub; i++) step(h);
  for (const p of players) { p.trail.push([p.x, p.y]); if (p.trail.length > 14) p.trail.shift(); }
  if (game.winner) {
    game.state = "over";
    setTimeout(showResult, 900);
  }
}
function standings() {
  return [...players].sort((a, b) => (b === game.winner) - (a === game.winner) || b.prog - a.prog);
}
function showResult() {
  const w = game.winner;
  document.getElementById("rtitle").textContent = `🏆 ${w.name}${w.type === "cpu" ? "（CPU）" : ""} の勝ち！`;
  const list = document.getElementById("rlist"); list.innerHTML = "";
  standings().forEach(p => {
    const li = document.createElement("li");
    li.innerHTML = `<span style="color:${p.color}">●</span> ${p.name}${p.type === "cpu" ? "（CPU）" : ""} — ${Math.min(p.prog, p.total)}/${p.total} ゲート`;
    list.appendChild(li);
  });
  document.getElementById("result").classList.remove("hidden");
}

// ---- render ----
function drawTable() {
  ctx.fillStyle = "#4a2c14"; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 800);
  g.addColorStop(0, "#1c8a5a"); g.addColorStop(1, "#0b5a3a");
  ctx.fillStyle = g; ctx.fillRect(CUSH, CUSH, W - 2 * CUSH, H - 2 * CUSH);
  ctx.strokeStyle = "#2b180a"; ctx.lineWidth = 4; ctx.strokeRect(CUSH, CUSH, W - 2 * CUSH, H - 2 * CUSH);
  for (const [x, y] of pockets) { ctx.fillStyle = "#050505"; ctx.beginPath(); ctx.arc(x, y, POCKET_R + 3, 0, 7); ctx.fill(); }
  // gates
  gates.forEach((g, i) => {
    ctx.strokeStyle = "#ffffff55"; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.moveTo(g.A.x, g.A.y); ctx.lineTo(g.B.x, g.B.y); ctx.stroke(); ctx.setLineDash([]);
    // direction arrow
    ctx.fillStyle = "#ffffff44"; ctx.beginPath();
    const ax = g.cx + g.nx * 22, ay = g.cy + g.ny * 22;
    ctx.moveTo(ax, ay); ctx.lineTo(g.cx - g.ny * 9, g.cy + g.nx * 9); ctx.lineTo(g.cx + g.ny * 9, g.cy - g.nx * 9); ctx.fill();
    ctx.fillStyle = "#ffffffaa"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(i === 0 ? "S/G" : i, g.cx - g.nx * 34 + (g.ny ? 22 : 0), g.cy - g.ny * 34 + 5);
  });
  // next-gate highlights
  players.forEach((p, k) => {
    if (p.finished) return; const g = gates[p.prog % gates.length];
    ctx.strokeStyle = p.color; ctx.lineWidth = 4; ctx.globalAlpha = .8;
    ctx.beginPath(); ctx.moveTo(g.A.x, g.A.y); ctx.lineTo(g.B.x, g.B.y); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(g.cx, g.cy, 14 + k * 5, 0, 7); ctx.stroke();
  });
  for (const q of posts) {
    const gr = ctx.createRadialGradient(q.x - 3, q.y - 3, 1, q.x, q.y, POST_R);
    gr.addColorStop(0, "#fff"); gr.addColorStop(1, "#9aa5b0");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(q.x, q.y, POST_R, 0, 7); ctx.fill();
  }
}
function drawBall(p) {
  if (p.finished) ctx.globalAlpha = .35;
  p.trail.forEach(([x, y], i) => {
    ctx.fillStyle = p.color; ctx.globalAlpha = (i / p.trail.length) * .2 * (p.finished ? .3 : 1);
    ctx.beginPath(); ctx.arc(x, y, R * .7, 0, 7); ctx.fill();
  });
  ctx.globalAlpha = p.finished ? .35 : 1;
  const r = R * p.scale; if (r <= 0.5) { ctx.globalAlpha = 1; return; }
  ctx.fillStyle = "#0004"; ctx.beginPath(); ctx.arc(p.x + 3, p.y + 4, r, 0, 7); ctx.fill();
  const gr = ctx.createRadialGradient(p.x - r * .35, p.y - r * .35, 1, p.x, p.y, r);
  gr.addColorStop(0, "#fff"); gr.addColorStop(.25, p.color); gr.addColorStop(1, "#000a");
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
  if (p.flash > 0) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, R + (.2 - p.flash) * 120, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;
  if (p.type === "human" && !p.finished && p.falling <= 0) {
    const pw = p.charging ? chargePower(p) : 0, len = 40 + pw * 110;
    ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.setLineDash([4, 7]);
    ctx.beginPath(); ctx.moveTo(p.x + Math.cos(p.aim) * 20, p.y + Math.sin(p.aim) * 20);
    ctx.lineTo(p.x + Math.cos(p.aim) * (20 + len), p.y + Math.sin(p.aim) * (20 + len)); ctx.stroke(); ctx.setLineDash([]);
    // cooldown / power ring
    ctx.lineWidth = 4;
    if (p.charging) { ctx.strokeStyle = `hsl(${120 - pw * 120},90%,55%)`; ctx.beginPath(); ctx.arc(p.x, p.y, R + 8, -Math.PI / 2, -Math.PI / 2 + pw * 6.283); ctx.stroke(); }
    else if (p.cd > 0) { ctx.strokeStyle = "#fff6"; ctx.beginPath(); ctx.arc(p.x, p.y, R + 8, -Math.PI / 2, -Math.PI / 2 + (1 - p.cd / .45) * 6.283); ctx.stroke(); }
  }
}
function drawHUD() {
  ctx.textAlign = "left"; ctx.font = "bold 15px sans-serif";
  players.forEach((p, i) => {
    const x = 50 + i * 300, y = 8;
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, y + 11, 7, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.fillText(`${p.name}${p.type === "cpu" ? " CPU" : ""}`, x + 14, y + 16);
    const bw = 150, pr = Math.min(1, p.prog / p.total);
    ctx.fillStyle = "#0006"; ctx.fillRect(x + 80, y + 5, bw, 12);
    ctx.fillStyle = p.color; ctx.fillRect(x + 80, y + 5, bw * pr, 12);
    ctx.fillStyle = "#fff"; ctx.font = "11px sans-serif"; ctx.fillText(`${Math.min(p.prog, p.total)}/${p.total}`, x + 80 + bw + 6, y + 16);
    ctx.font = "bold 15px sans-serif";
  });
  if (game) {
    ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 15px sans-serif";
    ctx.fillText(game.time.toFixed(1) + "s", W - 20, 24);
  }
  ctx.textAlign = "center";
  if (game && game.state === "count") {
    ctx.fillStyle = "#fff"; ctx.font = "bold 140px sans-serif"; ctx.shadowColor = "#000"; ctx.shadowBlur = 20;
    ctx.fillText(Math.ceil(game.t), W / 2, H / 2 + 50); ctx.shadowBlur = 0;
  }
  if (game && game.paused) {
    ctx.fillStyle = "#000a"; ctx.fillRect(0, 0, W, H); ctx.fillStyle = "#fff"; ctx.font = "bold 60px sans-serif";
    ctx.fillText("一時停止（P / Esc で再開）", W / 2, H / 2);
  }
}
function render() {
  drawTable();
  if (game) { players.forEach(drawBall); drawHUD(); }
}

function loop(t) {
  const dt = Math.min(.05, (t - lastT) / 1000 || 0); lastT = t;
  update(dt); render(); requestAnimationFrame(loop);
}
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + "px"; cv.style.height = H * s + "px";
}
addEventListener("resize", fit); fit();
buildMenu();
document.getElementById("start").onclick = startGame;
document.getElementById("again").onclick = startGame;
document.getElementById("tomenu").onclick = () => {
  document.getElementById("result").classList.add("hidden"); document.getElementById("menu").classList.remove("hidden"); game = null; players = [];
};
requestAnimationFrame(loop);
window.__dbg = () => ({ game, players });
</script>
</body>
</html>
